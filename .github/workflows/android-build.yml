name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required SDK packages
        run: |
          # The ubuntu runner image already ships the Android SDK + sdkmanager.
          # We install our packages directly, because
          # android-actions/setup-android@v3 currently fails on fresh runners:
          # it tries to install the long-removed "tools" package.
          if ! command -v sdkmanager > /dev/null; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          VERSION="1.0.0-${{ github.run_number }}"
          # ABI splits are enabled, so output names look like:
          #   app-arm64-v8a-release.apk / app-universal-debug.apk
          for type in debug release; do
            for f in app/build/outputs/apk/$type/*.apk; do
              base=$(basename "$f" .apk)                 # e.g. app-arm64-v8a-release
              abi=$(echo "$base" | sed -E "s/^app-(.*)-${type}$/\1/")
              if [ "$abi" = "$base" ]; then abi="universal"; fi
              cp "$f" "dist/UltraSniffer-${abi}-${type}-${VERSION}.apk"
            done
          done
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UltraSniffer-APK-${{ github.run_number }}
          # Keep the artifact small (free accounts have a 500 MB
          # artifact-storage quota). Full set is on the "latest" release.
          path: dist/*arm64-v8a*.apk
          retention-days: 7

      - name: Publish/update "latest" GitHub release (easy APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ultra Floating Video Sniffer — Latest Build"
          body: |
            Automatic build from commit `${{ github.sha }}`.

            **Install:** फ़ोन में नीचे वाली APK download करके install करें
            (Settings में "Install unknown apps" allow करना पड़ेगा)।

            - `UltraSniffer-arm64-v8a-release-*.apk` — ज़्यादातर नए फ़ोनों के लिए **(recommended)**
            - `UltraSniffer-universal-release-*.apk` — अगर ऊपर वाली install न हो, तो यह लें
            - `*-debug-*.apk` — same app का debug variant (backup के लिए)
          files: dist/*.apk
          make_latest: true
