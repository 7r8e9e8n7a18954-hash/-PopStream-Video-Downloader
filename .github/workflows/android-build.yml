name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required SDK packages
        run: |
          # The ubuntu runner image already ships the Android SDK + sdkmanager.
          # We install our packages directly, because
          # android-actions/setup-android@v3 currently fails on fresh runners:
          # it tries to install the long-removed "tools" package.
          if ! command -v sdkmanager > /dev/null; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (playlist parsers)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          VERSION="1.0.0-${{ github.run_number }}"
          # ABI splits are enabled, so output names look like:
          #   app-arm64-v8a-release.apk / app-universal-debug.apk
          for type in debug release; do
            for f in app/build/outputs/apk/$type/*.apk; do
              base=$(basename "$f" .apk)                 # e.g. app-arm64-v8a-release
              abi=$(echo "$base" | sed -E "s/^app-(.*)-${type}$/\1/")
              if [ "$abi" = "$base" ]; then abi="universal"; fi
              cp "$f" "dist/UltraSniffer-${abi}-${type}-${VERSION}.apk"
            done
          done

          # Stable names for the release page: हर build पर वही file name, इसलिए
          # पुरानी APK अपने-आप replace हो जाती है और download link कभी नहीं टूटता।
          for abi in arm64-v8a armeabi-v7a universal; do
            src=$(ls dist/UltraSniffer-${abi}-release-${VERSION}.apk 2>/dev/null || true)
            [ -n "$src" ] && cp "$src" "dist/UltraSniffer-${abi}.apk"
          done
          ls -lh dist

      - name: Remove stale APK assets from the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --json assets --jq '.assets[].name' 2>/dev/null \
            | grep '\.apk$' \
            | while read -r name; do gh release delete-asset latest "$name" -y || true; done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UltraSniffer-APK-${{ github.run_number }}
          # Keep the artifact small (free accounts have a 500 MB
          # artifact-storage quota). Full set is on the "latest" release.
          path: dist/UltraSniffer-arm64-v8a-debug-*.apk
          retention-days: 7

      - name: Publish/update "latest" GitHub release (easy APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ultra Floating Video Sniffer — Latest Build"
          body: |
            Automatic build from commit `${{ github.sha }}` (run #${{ github.run_number }}).

            ## 📲 फ़ोन में install करने का तरीका
            1. नीचे Assets में से **`UltraSniffer-arm64-v8a.apk` (≈29 MB)** download करें —
               2017 के बाद के लगभग सारे Android फ़ोन इसी के हैं।
               * अगर "App not installed" आए → `UltraSniffer-armeabi-v7a.apk` (पुराना 32-bit फ़ोन)
               * अगर पता न हो → `UltraSniffer-universal.apk` (≈109 MB, दोनों ABI)
            2. File खोलें → "Install unknown apps" allow करें → Install।
            3. App में **Start Sniffer & VPN** दबाएँ और Android के VPN +
               "Display over other apps" permissions दे दें।
            4. अब किसी भी app/browser में video चलाएँ → floating
               **"Download This Video"** बटन tap करें → FFmpeg merge होकर
               gallery (Movies/UltraSniffer) में save हो जाएगा।

            पूरा guide + architecture: repo के `README.md` में।
          files: |
            dist/UltraSniffer-arm64-v8a.apk
            dist/UltraSniffer-armeabi-v7a.apk
            dist/UltraSniffer-universal.apk
          make_latest: true
