name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required SDK packages
        run: |
          # The ubuntu runner image already ships the Android SDK + sdkmanager.
          # We install our packages directly, because
          # android-actions/setup-android@v3 currently fails on fresh runners:
          # it tries to install the long-removed "tools" package.
          if ! command -v sdkmanager > /dev/null; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (playlist parsers)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          VERSION="1.1.0-${{ github.run_number }}"
          # ---- Release page: exactly ONE file --------------------------------
          # The universal APK contains every supported ABI, so it installs on
          # any phone. One file = zero confusion about which APK to download.
          cp app/build/outputs/apk/release/app-universal-release.apk dist/UltraSniffer.apk
          # ---- CI artifacts: per-ABI builds (smaller downloads) --------------
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)                 # e.g. app-arm64-v8a-release
            abi=$(echo "$base" | sed -E "s/^app-(.*)-release$/\1/")
            if [ "$abi" = "$base" ]; then abi="universal"; fi
            cp "$f" "dist/UltraSniffer-${abi}-release-${VERSION}.apk"
          done
          ls -lh dist

      - name: Remove stale APK assets from the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --json assets --jq '.assets[].name' 2>/dev/null \
            | grep '\.apk$' \
            | while read -r name; do gh release delete-asset latest "$name" -y || true; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraSniffer-APK-${{ github.run_number }}
          # Exactly ONE file — the same universal APK as the release page.
          path: dist/UltraSniffer.apk
          retention-days: 7

      - name: Publish/update "latest" GitHub release (easy APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ultra Floating Video Sniffer — Latest Build"
          body: |
            Automatic build from commit `${{ github.sha }}` (run #${{ github.run_number }}).

            ## 📲 install करने का तरीका
            नीचे Assets में सिर्फ़ **एक file** है:
            **`UltraSniffer.apk`** — इसे download करें, खोलें, Install करें।
            (इसमें सभी फ़ोन की libraries हैं — कोई confusion नहीं।)

            ## ✨ इस build (v1.2.0) में नया
            * **Instagram + Facebook** links भी download होते हैं (public Reels/posts/videos,
              fb.watch support) — YouTube की तरह link Share/Paste करें।
            * **Downloads अब ~2x तेज़** — HLS/DASH chunks 8 parallel connections से,
              video+audio tracks साथ-साथ download, टूटे download auto-resume (retry 3x)।
            * **एक video = एक entry** — master playlist + variants + chunks अब list में
              अलग-अलग नहीं दिखते (यही "3 results" वाली confusion थी)।
            * YouTube home-page के preview clips की fake entries बंद — सिर्फ़ आपकी
              चलाई हुई video ही पकड़ी जाती है।
            * कुछ भी block/बंद नहीं — कोई password, कोई admin panel, कोई kill-switch।
              (DRM-protected paid content — Netflix/Prime/Hotstar आदि — नहीं होता, यह
              Android की security है, हर app पर लागू।)

            ## ▶️ 3 step में चलाएँ
            1. App खोलें → **Start Sniffer & VPN** → Android की VPN +
               "Display over other apps" permission allow करें।
            2. किसी भी app/browser में video चलाएँ → floating
               **"Download This Video"** बटन tap करें।
            3. YouTube जैसी encrypted sites के लिए: link को app में
               **Share** करें या app के paste box में डालें → quality चुनें।

            पूरा guide: repo की `README.md`।
          files: |
            dist/UltraSniffer.apk
          make_latest: true
